# Zeta permission policy (defaults).
#
# Decisions per risk level for each tool category:
#   allow    - execute immediately
#   confirm  - pause and ask the user in the UI
#   deny     - never execute
#
# Risk levels: READ_ONLY, SAFE, SENSITIVE, DANGEROUS, BLOCKED (BLOCKED is always denied).
# Spec-style aliases also work: read -> READ_ONLY, write -> SENSITIVE, delete -> DANGEROUS,
#                              allowed -> allow, confirmation -> confirm.
#
# Do not edit this file for local changes; the setup wizard / Settings UI writes
# permissions.local.yaml which overrides these values.

permissions:
  default:
    READ_ONLY: allow
    SAFE: allow
    SENSITIVE: confirm
    DANGEROUS: confirm
    BLOCKED: deny

  filesystem:
    read: allowed
    SAFE: allow
    write: allowed          # create/copy/move/rename inside allowed roots
    delete: confirmation    # delete / overwrite
    BLOCKED: deny

  computer:
    READ_ONLY: allow
    SAFE: allow             # launch/focus apps, clipboard, screenshots
    SENSITIVE: allow        # close apps, lock
    DANGEROUS: confirm      # force kill, shutdown/restart
    BLOCKED: deny

  terminal:
    safe_commands: allowed
    sensitive_commands: confirmation
    dangerous_commands: confirmation   # set to "blocked" for the strictest posture
    BLOCKED: deny

  browser:
    READ_ONLY: allow
    SAFE: allow
    SENSITIVE: confirm      # form fills, downloads, uploads, purchase-like clicks
    DANGEROUS: confirm
    BLOCKED: deny

  messaging:
    READ_ONLY: allow
    SAFE: allow
    send: confirmation      # sending WhatsApp messages
    DANGEROUS: confirm
    BLOCKED: deny

  email:
    READ_ONLY: allow
    SAFE: allow
    SENSITIVE: confirm      # sending email, saving attachments
    DANGEROUS: confirm
    BLOCKED: deny

  developer:
    READ_ONLY: allow
    SAFE: allow
    SENSITIVE: confirm
    DANGEROUS: deny
    BLOCKED: deny

  memory:
    READ_ONLY: allow
    SAFE: allow
    SENSITIVE: allow        # forget by topic
    DANGEROUS: confirm      # forget everything
    BLOCKED: deny

  screen:
    READ_ONLY: allow        # analyze screen
    SAFE: confirm
    SENSITIVE: confirm      # click / type / hotkeys
    DANGEROUS: confirm
    BLOCKED: deny

  scheduler:
    READ_ONLY: allow
    SAFE: allow
    SENSITIVE: allow
    DANGEROUS: confirm
    BLOCKED: deny

  agent:
    READ_ONLY: allow
    SAFE: allow
    SENSITIVE: allow
    DANGEROUS: confirm
    BLOCKED: deny

# Capability switches (the setup wizard toggles these). Disabled categories are
# hidden from the model entirely.
enabled:
  filesystem: true
  computer: true
  terminal: true
  browser: true
  messaging: true
  email: true
  developer: true
  memory: true
  screen: true
  scheduler: true
  agent: true

# Individual tools to hide from the model regardless of category.
disabled_tools: []
